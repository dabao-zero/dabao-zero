name: Scanner canary

# ADR-0010 decision 7. Trivy and Grype are pinned (version and checksum) so an upgrade is a decision,
# not a surprise. Weekly, and on demand, this checks that the pinned scanners still honour our VEX
# statements and still clear exactly the one CVE a statement names. A failure means a scanner
# changed how it reads VEX: do not enable VEX clearing until it is understood.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.70.0"
      TRIVY_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
      GRYPE_VERSION: "0.121.0"
      GRYPE_SHA256: "64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install pinned Trivy and Grype (checksum verified)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C "$HOME/bin" trivy
          curl -sSfL -o grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          tar -xzf grype.tgz -C "$HOME/bin" grype
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: trivy --version && grype version
      - run: make test-scanners
