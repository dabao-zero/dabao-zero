[project]
name = "dabao"
version = "0.0.0"
description = "Agent-run CVE patching for container images"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.143,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.54,<1",
]

[project.scripts]
dabao = "dabao.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dabao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Docker or other real infrastructure",
  "docker: builds real images; slow, needs Docker, buildx and network (make test-docker)",
  "scanners: needs trivy and grype and network; the VEX canary (make test-scanners)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
